<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>林晓雅 · Lin Xiaoya</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f5f7f2, #e8f0e8);
      color: #26352b;
      min-height: 100vh;
    }

    .app {
      max-width: 500px;
      margin: auto;
      padding: 24px 18px 40px;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .name {
      font-size: 32px;
      font-weight: bold;
    }

    .latin {
      direction: ltr;
      font-size: 16px;
      margin-top: 5px;
      color: #657268;
    }

    .card {
      background: rgba(255,255,255,0.9);
      border-radius: 24px;
      padding: 25px 20px;
      margin-bottom: 18px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    .chinese {
      direction: ltr;
      text-align: center;
      font-size: 48px;
      margin: 10px 0;
    }

    .pinyin {
      direction: ltr;
      text-align: center;
      font-size: 25px;
      color: #52705c;
    }

    .persian {
      text-align: center;
      font-size: 17px;
      margin-top: 8px;
    }

    .english {
      direction: ltr;
      text-align: center;
      color: #777;
      margin-top: 5px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 15px;
      margin-top: 12px;
      font-size: 17px;
      cursor: pointer;
    }

    .listen {
      background: #dcebdd;
      color: #29442f;
    }

    .record {
      background: #52705c;
      color: white;
    }

    .stop {
      background: #e7dada;
      color: #633d3d;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .status {
      text-align: center;
      margin-top: 18px;
      min-height: 25px;
      font-weight: bold;
    }

    .result {
      display: none;
      margin-top: 18px;
      padding: 18px;
      background: #f2f6f2;
      border-radius: 16px;
    }

    .result h3 {
      margin-top: 0;
    }

    .value {
      direction: ltr;
      text-align: center;
      font-size: 28px;
      margin: 10px;
    }

    .note {
      font-size: 14px;
      line-height: 1.8;
      color: #657268;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="name">林晓雅</div>
    <div class="latin">Lín Xiǎoyǎ · Mandarin Coach</div>
  </div>

  <div class="card">

    <div class="chinese">你好</div>

    <div class="pinyin">Nǐ hǎo</div>

    <div class="persian">نی هاو — سلام</div>

    <div class="english">Hello</div>

    <button class="listen" onclick="speakChinese()">
      🔊 گوش بده
    </button>

    <button class="record" id="recordButton" onclick="startRecording()">
      🎙️ حالا تو بگو
    </button>

    <button class="stop" id="stopButton" onclick="stopRecording()" disabled>
      ⏹️ توقف
    </button>

    <div class="status" id="status">
      آماده‌ای؟ 😊
    </div>

    <div class="result" id="result">

      <h3>📊 بررسی اولیه‌ی صدا</h3>

      <div>Pitch تقریبی صدای تو:</div>

      <div class="value" id="pitchValue">
        --
      </div>

      <div id="pitchMessage"></div>

      <div class="note">
        این فقط اولین آزمایش است و هنوز ارزیابی کامل تلفظ Mandarin نیست.
        در مراحل بعدی، تحلیل Tone و تلفظ هجاها را دقیق‌تر می‌کنیم.
      </div>

    </div>

  </div>

</div>

<script>

let audioContext;
let analyser;
let microphone;
let animationFrame;
let stream;

function speakChinese() {

  if (!("speechSynthesis" in window)) {
    alert("مرورگر شما قابلیت پخش گفتار را ندارد.");
    return;
  }

  const utterance = new SpeechSynthesisUtterance("你好");

  utterance.lang = "zh-CN";
  utterance.rate = 0.75;
  utterance.pitch = 1;

  speechSynthesis.cancel();
  speechSynthesis.speak(utterance);
}

async function startRecording() {

  try {

    stream = await navigator.mediaDevices.getUserMedia({
      audio: true
    });

    audioContext = new (window.AudioContext || window.webkitAudioContext)();

    analyser = audioContext.createAnalyser();

    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.5;

    microphone = audioContext.createMediaStreamSource(stream);

    microphone.connect(analyser);

    document.getElementById("recordButton").disabled = true;
    document.getElementById("stopButton").disabled = false;

    document.getElementById("status").innerText =
      "🎙️ دارم گوش می‌دم... بگو: 你好";

    document.getElementById("result").style.display = "none";

    analysePitch();

  } catch (error) {

    document.getElementById("status").innerText =
      "❌ دسترسی به میکروفون داده نشد.";

    console.error(error);

  }

}

function stopRecording() {

  if (stream) {

    stream.getTracks().forEach(track => track.stop());

  }

  if (animationFrame) {

    cancelAnimationFrame(animationFrame);

  }

  if (audioContext) {

    audioContext.close();

  }

  document.getElementById("recordButton").disabled = false;
  document.getElementById("stopButton").disabled = true;

  document.getElementById("status").innerText =
    "✅ ضبط تمام شد.";

}

function analysePitch() {

  if (!analyser) return;

  const buffer = new Float32Array(analyser.fftSize);

  analyser.getFloatTimeDomainData(buffer);

  const pitch = detectPitch(buffer, audioContext.sampleRate);

  if (pitch > 0) {

    document.getElementById("pitchValue").innerText =
      Math.round(pitch) + " Hz";

    document.getElementById("pitchMessage").innerText =
      "🎵 صدای تو شناسایی شد. فعلاً داریم Pitch را اندازه می‌گیریم.";

  }

  animationFrame = requestAnimationFrame(analysePitch);

}

function detectPitch(buffer, sampleRate) {

  let SIZE = buffer.length;

  let rms = 0;

  for (let i = 0; i < SIZE; i++) {

    rms += buffer[i] * buffer[i];

  }

  rms = Math.sqrt(rms / SIZE);

  if (rms < 0.01) return -1;

  let bestCorrelation = 0;
  let bestOffset = -1;

  for (let offset = 20; offset < 1000; offset++) {

    let correlation = 0;

    for (let i = 0; i < SIZE - offset; i++) {

      correlation += buffer[i] * buffer[i + offset];

    }

    correlation /= SIZE - offset;

    if (correlation > bestCorrelation) {

      bestCorrelation = correlation;
      bestOffset = offset;

    }

  }

  if (bestOffset === -1) return -1;

  return sampleRate / bestOffset;

}

</script>

</body>
</html>
