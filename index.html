<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>林晓雅 - Lin Xiaoya</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7f2;
      text-align: center;
      padding: 30px 15px;
      color: #333;
    }

    .card {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h1 {
      margin-bottom: 5px;
    }

    .chinese {
      font-size: 48px;
      margin: 20px 0 5px;
    }

    .pinyin {
      font-size: 22px;
      color: #555;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 14px 20px;
      margin: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    #listenBtn {
      background: #e8f0df;
    }

    #micBtn {
      background: #dcefe8;
    }

    #stopBtn {
      background: #f2dddd;
    }

    #status {
      margin-top: 20px;
      font-weight: bold;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      background: #f7f7f7;
      border-radius: 12px;
      min-height: 50px;
    }

    #level {
      margin: 15px auto;
      width: 90%;
      height: 20px;
      background: #ddd;
      border-radius: 10px;
      overflow: hidden;
    }

    #levelBar {
      height: 100%;
      width: 0%;
      background: #6b8e5a;
      transition: width 0.05s;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>林晓雅</h1>
  <p>Lin Xiaoya — مربی و دوست چینی تو 🌱</p>

  <div class="chinese">你好</div>

  <div class="pinyin">Nǐ hǎo</div>

  <p>نی هاو — سلام</p>
  <p>Hello</p>

  <button id="listenBtn">🔊 گوش بده</button>

  <button id="micBtn">🎙️ حالا تو بگو</button>

  <button id="stopBtn">⏹️ توقف</button>

  <div id="status">آماده‌ام؛ بگو 😊</div>

  <div id="level">
    <div id="levelBar"></div>
  </div>

  <div id="result">
    هنوز صدایی دریافت نشده.
  </div>

</div>

<script>

let audioContext;
let analyser;
let microphone;
let animationId;

const status = document.getElementById("status");
const result = document.getElementById("result");
const levelBar = document.getElementById("levelBar");

document.getElementById("listenBtn").addEventListener("click", () => {

  const speech = new SpeechSynthesisUtterance("你好");

  speech.lang = "zh-CN";
  speech.rate = 0.8;

  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(speech);

  status.textContent = "林晓雅 گفت: 你好 😊";

});

document.getElementById("micBtn").addEventListener("click", async () => {

  try {

    const stream = await navigator.mediaDevices.getUserMedia({
      audio: true
    });

    audioContext = new (window.AudioContext || window.webkitAudioContext)();

    analyser = audioContext.createAnalyser();

    analyser.fftSize = 2048;

    microphone = audioContext.createMediaStreamSource(stream);

    microphone.connect(analyser);

    status.textContent = "🎙️ دارم گوش می‌دم... بگو!";

    result.innerHTML = "صدای تو در حال دریافت است...";

    measureSound();

  } catch (error) {

    status.textContent = "❌ دسترسی به میکروفون برقرار نشد.";

    result.innerHTML =
      "لطفاً اجازه استفاده از میکروفون را بررسی کن.";

    console.log(error);

  }

});

function measureSound() {

  const data = new Uint8Array(analyser.fftSize);

  analyser.getByteTimeDomainData(data);

  let sum = 0;

  for (let i = 0; i < data.length; i++) {

    const value = (data[i] - 128) / 128;

    sum += value * value;

  }

  const volume = Math.sqrt(sum / data.length);

  const percent = Math.min(volume * 500, 100);

  levelBar.style.width = percent + "%";

  result.innerHTML =
    "🎧 صدای تو دریافت می‌شود.<br>" +
    "شدت تقریبی صدا: " +
    Math.round(volume * 100) +
    "%";

  animationId = requestAnimationFrame(measureSound);

}

document.getElementById("stopBtn").addEventListener("click", () => {

  if (animationId) {
    cancelAnimationFrame(animationId);
  }

  if (microphone) {
    microphone.disconnect();
  }

  if (audioContext) {
    audioContext.close();
  }

  levelBar.style.width = "0%";

  status.textContent = "⏹️ گوش دادن متوقف شد.";

  result.innerHTML =
    "تست صدا تمام شد. دوباره می‌توانی امتحان کنی.";

});

</script>

</body>
</html>
